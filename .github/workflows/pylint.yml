name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Analysing the code with pylint
      run: |
        pylint --fail-under=8.5 $(git ls-files '*.py') #Check the code quality if its greater or equal 9 it will pass otherwise pipeline will fail
        #        pylint --disable=C0103, R1705, R1703, R1723 $(git ls-files '*.py') # If you want to disable perticular warning


